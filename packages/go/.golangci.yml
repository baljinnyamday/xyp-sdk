version: "2"

linters:
  default: none
  enable:
    - bodyclose # a leaked response body leaks a connection
    - errcheck
    - errorlint # errors.Is/As instead of == and type switches
    - gocritic
    - govet
    - ineffassign
    - misspell
    - noctx # every outgoing request must carry the caller's context
    - revive
    - staticcheck
    - unused
    - gosec
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readable field order beats a few bytes per struct
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: early-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    rules:
      # Generated code is the emitter's responsibility, not a reviewer's.
      - path: (^|/)registry\.go$
        linters: [revive]
      - path: _test\.go$
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
