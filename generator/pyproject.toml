[project]
name = "xyp-generator"
version = "0.1.0"
description = "Generates the XYP SDKs from spec/services.json"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[project.scripts]
xyp-generate = "xyp_generator.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xyp_generator"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID252"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
