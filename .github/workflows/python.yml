name: python

on:
  push:
    branches: [main]
    paths: ["packages/python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["packages/python/**", ".github/workflows/python.yml"]

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  wheel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --out-dir dist
      - name: The installed wheel works with stable dependencies
        run: uv run --isolated --no-project --with dist/*.whl python scripts/release_check.py
      - name: ...and when the user enables pre-releases of every dependency (pip install --pre)
        run: uv run --isolated --no-project --prerelease allow --with dist/*.whl python scripts/release_check.py
      - name: The installed wheel ships the CA certificates
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "from xyp._tls import build_verify; assert len(build_verify(True).get_ca_certs()) == 2"
