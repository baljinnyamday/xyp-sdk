name: typescript-release

# Publishes packages/typescript to npm when a tag like typescript-v0.1.0-alpha.2 is pushed.
# Uses npm Trusted Publishing (OIDC): no npm token exists anywhere. npm only allows a
# trusted publisher on a package that already exists, so the very first version is
# published by hand (see packages/typescript/README.md, "Releasing").
on:
  push:
    tags: ["typescript-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No `registry-url`: setup-node would write an `_authToken` placeholder into .npmrc,
      # and npm then skips the OIDC exchange that trusted publishing relies on.
      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Tag must match the package version
        run: test "typescript-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm test:consumer
      - name: Pre-releases go to their own dist-tag so `npm install xyp-sdk` never gets one
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag="${version#*-}"; tag="${tag%%.*}" ;; *) tag=latest ;; esac
          npm publish --access public --provenance --tag "$tag"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#typescript-v}"
          case "$version" in *-*) flags="--prerelease --latest=false" ;; *) flags="" ;; esac
          {
            echo "**Install:** \`npm install xyp-sdk@$version\` · [npm](https://www.npmjs.com/package/xyp-sdk/v/$version) · [README](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME/packages/typescript#readme)"
            echo
          } > notes.md
          previous=$(git ls-remote --tags --refs --sort=-v:refname origin 'typescript-v*' | awk -F/ '{print $3}' | grep -vx "$GITHUB_REF_NAME" | head -1)
          gh release create "$GITHUB_REF_NAME" --title "Node.js / TypeScript: xyp-sdk $version" --notes-file notes.md \
            --generate-notes ${previous:+--notes-start-tag "$previous"} $flags
