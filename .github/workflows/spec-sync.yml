name: spec-sync

# XYP adds and changes services without notice. Every week this re-fetches the public
# catalog, regenerates every SDK, tests them, and opens a pull request when anything
# changed. GitHub holds the usual CI on a bot-opened pull request until a maintainer
# clicks "Approve and run workflows", so the same checks run here first.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # gofmt is what the Go emitter formats its output with.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: packages/go/go.mod

      - name: Fetch the catalog from developer.xyp.gov.mn
        run: |
          cp spec/services.json "$RUNNER_TEMP/services.old.json"
          uv run spec/fetch_spec.py

      - name: Summarise what changed
        id: diff
        run: |
          uv run spec/diff_spec.py "$RUNNER_TEMP/services.old.json" spec/services.json > "$RUNNER_TEMP/summary.md"
          if [ -s "$RUNNER_TEMP/summary.md" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          cat "$RUNNER_TEMP/summary.md"

      - name: Regenerate every SDK
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile --dir packages/typescript
          cd generator && uv sync && uv run xyp-generate

      - name: Test the Python SDK
        if: steps.diff.outputs.changed == 'true'
        working-directory: packages/python
        run: uv sync && uv run ruff check . && uv run pyright && uv run pytest

      - name: Test the TypeScript SDK
        if: steps.diff.outputs.changed == 'true'
        working-directory: packages/typescript
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm test:consumer

      - name: Test the Go SDK
        if: steps.diff.outputs.changed == 'true'
        working-directory: packages/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./... && go build ./... && go test -race -count=1 ./...

      - name: Write the pull request description
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Every SDK was regenerated from the new catalog, and lint, type checks and"
            echo "tests already passed in the [sync run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "The usual CI on this pull request waits for you: click **Approve and run workflows** below."
            echo
            echo "**To release:** merge, bump the versions in \`packages/python/pyproject.toml\` and"
            echo "\`packages/typescript/package.json\`, then push the tags \`python-v<version>\`,"
            echo "\`typescript-v<version>\` and \`packages/go/v<version>\` (the Go module has no version"
            echo "file: the tag is the version). Removed or retyped fields are breaking for users;"
            echo "say so in the release notes."
          } > "$RUNNER_TEMP/body.md"

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: spec-sync
          delete-branch: true
          title: "Sync with XYP's service catalog"
          commit-message: "Sync with XYP's service catalog"
          body-path: ${{ runner.temp }}/body.md
          labels: spec-sync
